name: sonic baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install package with real Provider dependency
        working-directory: 代码/sonic
        run: python -m pip install -e ".[openai]"
      - name: Teaching baseline
        working-directory: 代码/sonic
        run: python -m unittest discover -s tests -v
      - name: Four docs, local links and sensitive-file guard
        run: python 代码/sonic/scripts/check_repo.py
