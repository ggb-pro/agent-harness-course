[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-agent"
version = "0.5.0"
description = "The auditable teaching core for the evolving sonic assistant"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
openai = ["openai>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

